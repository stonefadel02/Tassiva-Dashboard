services:
  - type: web
    name: tassiva
    env: docker
    plan: free
    autoDeploy: true
    # Render détecte le EXPOSE 8080
    # Renseigne tes variables d'env dans le dashboard ou ici:
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      # APP_KEY peut être générée automatiquement par start.sh
      - key: APP_URL
        value: https://tassiva.onrender.com
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: <ton-host-mysql>
      - key: DB_DATABASE
        value: <ta-base>
      - key: DB_USERNAME
        value: <user>
      - key: DB_PASSWORD
        value: <password>
      - key: DB_PORT
        value: 3306
